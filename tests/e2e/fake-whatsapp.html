<!doctype html><html><head><meta charset=utf-8></head><body><div id="pane-side"></div><div id="main"><header>Chat</header><div id="conv"></div><footer><div contenteditable="true"></div></footer></div>
<script>
// WhatsApp simulado para testes: WPP com eventos, lista de conversas, histórico e envio.
const handlers = {};
const now = Date.now() / 1000 | 0;
const mk = (chat, n, fromMe, body, t, ack = 3) => ({ id: { _serialized: `${fromMe}_${chat}_${n}`, fromMe, remote: chat }, type: "chat", body, t, ack, isNewMsg: true });
const store = {
  "5511999998888@c.us": [mk("5511999998888@c.us", 1, false, "Hi, I saw your ad", now - 3600), mk("5511999998888@c.us", 2, true, "Olá!", now - 3500), mk("5511999998888@c.us", 3, false, "Can you send the price?", now - 3400)],
  "123456789@lid": [mk("123456789@lid", 1, false, "Hello there", now - 7200)],
};
store["5511912345678@c.us"] = Array.from({ length: 120 }, (_, i) => mk("5511912345678@c.us", i, i % 3 === 0, `Mensagem número ${i + 1}`, now - 86400 * 3 + i * 600));
// mensagens de voz: um tom WAV de 1 s gerado aqui mesmo
const wav = (() => { const sr = 8000, n = sr, b = new DataView(new ArrayBuffer(44 + n * 2)); const w = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); b.setUint32(4, 36 + n * 2, true); w(8, "WAVEfmt "); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, sr, true); b.setUint32(28, sr * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, "data"); b.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) b.setInt16(44 + i * 2, Math.sin(i / sr * 2 * Math.PI * 440) * 8000, true); return new Blob([b.buffer], { type: "audio/wav" }); })();
store["5511999998888@c.us"].unshift(mk("5511999998888@c.us", "old", true, "Mensagem antiga minha", now - 70 * 3600));
const voice = (chat, n, t, duration) => ({ ...mk(chat, n, false, "", t), type: "ptt", body: undefined, duration });
store["5511999998888@c.us"].push(voice("5511999998888@c.us", "v1", now - 3300, 3), voice("5511999998888@c.us", "v2", now - 3200, 400));
window.__downloads = 0;
// mídias: foto (miniatura + imagem grande), vídeo, PDF, .docx e um arquivo de 9 MB (download em pedaços)
const canvasPng = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, "#0ea5e9"); gr.addColorStop(1, "#7c3aed"); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = "#fff"; g.font = `${Math.round(h / 6)}px sans-serif`; g.fillText("Órbita", w / 10, h / 2); return c.toDataURL("image/png"); };
const b64Blob = (dataUrl, type) => { const bin = atob(dataUrl.split(",")[1]); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };
const PDF = "%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 300 200]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj\n4 0 obj<</Length 44>>stream\nBT /F1 24 Tf 50 100 Td (Orbita PDF) Tj ET\nendstream endobj\n5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF";
const J = "5511999998888@c.us";
const media = (n, type, extra, t) => ({ ...mk(J, n, false, "", t), type, body: undefined, ...extra });
window.__media = {
  [`false_${J}_img1`]: b64Blob(canvasPng(1200, 800), "image/png"),
  [`false_${J}_vid1`]: new Blob([new Uint8Array(4000)], { type: "video/mp4" }),
  [`false_${J}_pdf1`]: new Blob([PDF], { type: "application/pdf" }),
  [`false_${J}_doc1`]: new Blob([new Uint8Array(2000)], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" }),
  [`false_${J}_big1`]: new Blob([new Uint8Array(9 * 1024 * 1024).fill(7)], { type: "application/zip" }),
};
store[J].push(
  media("img1", "image", { body: canvasPng(160, 107).split(",")[1], caption: "Foto do carro", mimetype: "image/jpeg", size: 245000, width: 1200, height: 800 }, now - 3100),
  media("vid1", "video", { body: canvasPng(160, 90).split(",")[1], mimetype: "video/mp4", size: 4000, width: 1280, height: 720, duration: 14 }, now - 3050),
  media("pdf1", "document", { filename: "Proposta TopBrasil.pdf", mimetype: "application/pdf", size: 1200, pageCount: 1 }, now - 3000),
  media("doc1", "document", { filename: "Contrato.docx", mimetype: "application/vnd.openxmlformats-officedocument.wordprocessingml.document", size: 2000 }, now - 2950),
  media("big1", "document", { filename: "Fotos.zip", mimetype: "application/zip", size: 9 * 1024 * 1024 }, now - 2900),
);
if (window.__extra) store["5511999998888@c.us"].push(mk("5511999998888@c.us", 4, false, "Missed while offline", now + 5));
const chats = {
  "5511999998888@c.us": { id: { _serialized: "5511999998888@c.us" }, contact: { name: "John Smith", pushname: "John" }, unreadCount: 2 },
  "5511912345678@c.us": { id: { _serialized: "5511912345678@c.us" }, contact: { name: "Carla Souza" }, unreadCount: 0 },
  "123456789@lid": { id: { _serialized: "123456789@lid" }, contact: { pushname: "Anna" }, formattedTitle: "Anna", unreadCount: 0 },
};
for (const [id, c] of Object.entries(chats)) { c.t = store[id].at(-1).t; c.msgs = { last: () => store[id].at(-1) }; }
const ok = (id) => ({ id: { _serialized: id }, sendMsgResult: Promise.resolve({ messageSendResult: "OK" }) });
let sent = 0;
const FAKE = {
  isReady: true, conn: { isMainReady: () => true, getMyUserId: () => ({ _serialized: "5511000000000@c.us" }) },
  on: (ev, fn) => ((handlers[ev] ||= []).push(fn)),
  loader: { onReady() {}, onInjected() {}, injectLoader() {} },
  chat: {
    get: (id) => chats[id],
    list: async () => Object.values(chats),
    getActiveChat: () => null,
    getMessages: async (id, o) => {
      const all = store[id] || [];
      const end = o.id ? all.findIndex((m) => m.id._serialized === o.id) : all.length;
      return all.slice(Math.max(0, end - o.count), end);
    },
    sendFileMessage: async (id, file, o) => {
      // como o WA-JS real: em texto (data URL), o tipo com parâmetros ("audio/ogg; codecs=opus") é recusado
      if (typeof file === "string" && !/^data:[\w.+-]+\/[\w.+-]+;base64,/.test(file)) throw "invalid_data_url";
      const magic = file instanceof Blob ? await file.slice(0, 4).text() : atob(file.slice(file.indexOf(",") + 1, file.indexOf(",") + 9)).slice(0, 4);
      const type = o.type && o.type !== "audio" ? o.type : o.isPtt ? "ptt" : "audio";
      const m = { ...mk(id, `f${++sent}`, true, "", Date.now() / 1000 | 0, 1), type, body: undefined, duration: 2, caption: o.caption, mimetype: o.mimetype, filename: o.filename, size: file.size };
      if (file instanceof Blob) (window.__files ||= []).push({ type: o.type, name: file.name, mime: file.type, size: file.size, caption: o.caption, magic, sum: [...new Uint8Array(await file.arrayBuffer())].reduce((a, b) => (a + b) % 1000003, 0) });
      window.__lastFile = { isPtt: o.isPtt, type: o.type, mime: o.mimetype, head: typeof file === "string" ? file.slice(0, 40) : `File ${file.name} ${file.type}`, oggMagic: magic === "OggS" };
      store[id].push(m);
      setTimeout(() => (handlers["chat.new_message"] || []).forEach((f) => f(m)), 300);
      return ok(m.id._serialized);
    },
    downloadMedia: async (id) => (window.__downloads++, (window.__dlIds ||= []).push(id), window.__media[id] || wav),
    markIsComposing: async () => (window.__presence ||= []).push("composing"),
    markIsRecording: async () => (window.__presence ||= []).push("recording"),
    markIsPaused: async () => (window.__presence ||= []).push("paused"),
    sendLocationMessage: async (id, o) => { const m = { ...mk(id, `l${++sent}`, true, "", Date.now() / 1000 | 0, 1), type: "location", body: undefined }; store[id].push(m); setTimeout(() => (handlers["chat.new_message"] || []).forEach((f) => f(m)), 200); return ok(m.id._serialized); },
    // como o WA-JS: revoke só vale para as suas mensagens; nas dos outros apaga só para você
    deleteMessage: async (chatId, id, clearMedia, revoke) => {
      const list = store[chatId];
      const i = list.findIndex((m) => m.id._serialized === id);
      (window.__deletes ||= []).push({ id, revoke });
      if (i < 0) return { id, sendMsgResult: "OK", isRevoked: false, isDeleted: true };
      if (revoke && list[i].id.fromMe) {
        list[i] = { ...list[i], type: "revoked", body: "" };
        setTimeout(() => (handlers["chat.msg_revoke"] || []).forEach((f) => f({ refId: { _serialized: id } })), 100);
        return { id, sendMsgResult: "OK", isRevoked: true, isDeleted: false, isSentByMe: true };
      }
      list.splice(i, 1);
      return { id, sendMsgResult: "OK", isRevoked: false, isDeleted: true };
    },
    getMessageById: async (id) => Object.values(store).flat().find((m) => m.id._serialized === id),
    sendTextMessage: async (id, text) => {
      const m = mk(id, `s${++sent}`, true, text, Date.now() / 1000 | 0, 1);
      store[id].push(m);
      setTimeout(() => (handlers["chat.new_message"] || []).forEach((f) => f(m)), 300); // WhatsApp também emite o evento do enviado
      return ok(m.id._serialized);
    },
  },
};
// fotos de perfil: John tem (vem do servidor), Anna não tem, Carla tem um link em memória que já expirou
const PIC = (color) => "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='${color}'/><circle cx='32' cy='25' r='12' fill='white'/><rect x='14' y='42' width='36' height='22' rx='11' fill='white'/></svg>`);
window.__picCalls = [];
FAKE.contact = { getProfilePictureUrl: async (id) => (window.__picCalls.push(id), id === "5511999998888@c.us" ? PIC("#0a7d5c") : id === "5511912345678@c.us" ? PIC("#b45309") : null) };
FAKE.whatsapp = { ProfilePicThumbStore: { get: (id) => (id === "5511912345678@c.us" ? { img: "https://expirado.invalid/foto.jpg" } : undefined) } };
Object.defineProperty(window, "WPP", { get: () => FAKE, set() {}, configurable: false });
window.__fire = (ev, payload) => (handlers[ev] || []).forEach((f) => f(payload));
window.__mk = mk; window.__store = store;
</script></body></html>
